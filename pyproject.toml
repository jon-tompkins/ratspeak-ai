[project]
name = "ratspeak-ai-bot"
version = "0.1.0"
description = "LXMF AI bot bridging Reticulum mesh to Venice (and other OpenAI-compatible providers)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Ratspeak contributors" }]
dependencies = [
    "lxmf>=0.7.0",
    "rns>=0.9.0",
    "openai>=1.40.0",
    "cryptography>=42.0.0",
    "tomli>=2.0.1; python_version < '3.11'",
]

[project.scripts]
ratspeak-ai-bot = "ratspeak_ai_bot.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ratspeak_ai_bot*"]
